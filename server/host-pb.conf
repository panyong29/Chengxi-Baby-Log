# 宿主机 nginx：kids.appifa.com (11443) 入口
#   /      -> web 客户端（compose 的 babylog-web，127.0.0.1:18080）
#   /api/  -> PocketBase（含 realtime SSE，关缓冲、长连接）
#   /_/    -> PocketBase 管理后台
# TLS 与 SNI 分流保持不动（stream.d/sni.conf 照旧把 kids.appifa.com 送到 11443）
server {
    listen 127.0.0.1:11443 ssl;
    server_name kids.appifa.com;

    ssl_certificate     /etc/letsencrypt/live/kids.appifa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kids.appifa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
